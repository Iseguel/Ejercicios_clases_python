
{% extends 'base.html' %}
{% block title %}Productos{% endblock %}
{% block content %}
<h1 class="h4 mb-3">Gestión de productos (solo lectura)</h1>
<div class="card shadow-sm">
    <table class="table table-striped table-hover mb-0">
        <thead class="table-dark">
            <tr><th>Nombre</th><th>Categoría</th><th class="text-end">Precio</th></tr>
        </thead>
        <tbody>
            {% for p in productos %}
            <tr>
                <td>{{ p.nombre }}</td>
                <td><span class="badge bg-secondary">{{ p.categoria }}</span></td>
                <td class="text-end">${{ p.precio }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
