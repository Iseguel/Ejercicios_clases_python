{% extends 'base.html' %}

{% block title %}{% if libro %}Editar{% else %}Nuevo{% endif %} libro{% endblock %}

{% block content %}
<h2>{% if libro %}Editar libro{% else %}Nuevo libro{% endif %}</h2>



<form method="post">
    {% csrf_token %}

    <div class="mb-3">
        <label class="form-label">Tipo</label>
        <select name="tipo" class="form-select">
            <option value="libro" {% if libro.tipo == 'libro' %}selected{% endif %}>Libro</option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Título</label>
        <input type="text" name="titulo" class="form-control"
               value="{% if libro %}{{ libro.titulo }}{% endif %}" maxlength="150" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Descripción</label>
        <textarea name="descripcion" class="form-control" rows="5" maxlength="1000" required>{% if libro %}{{ libro.descripcion }}{% endif %}</textarea>
    </div>

    <button type="submit" class="btn btn-primary">Guardar</button>
    <a href="{% url 'libros:lista' %}" class="btn btn-link">Cancelar</a>
</form>
{% endblock %}
